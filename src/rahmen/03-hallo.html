<!-- Hallo-Seite: das erste Blatt für das Kind -->

    <div class="koerper"><div style="flex: 1; border: 0.6mm dashed var(--grau); border-radius: 6mm"></div></div>
  </div>
  <div style="display: flex; gap: 8mm; height: 95mm">

      <div class="aufgabe-kopf"><k-tun box name="anmalen"></k-tun><p class="fuer-mich">Leg deine Hand hin. Ich fahre mit dem Stift rundherum.</p></div>
      <div class="koerper" style="flex: 1"><div style="flex: 1; border: 0.6mm dashed var(--grau); border-radius: 6mm"></div></div>
    </div>
    <div class="aufgabe" style="flex: 1; margin: 0">
      <div class="aufgabe-kopf"><k-tun box name="anmalen"></k-tun><p class="fuer-mich">Mal dein Lieblingstier.</p></div>
      <div class="koerper" style="flex: 1"><div style="flex: 1; border: 0.6mm dashed var(--grau); border-radius: 6mm"></div></div>
    </div>
  </div>

</section>
