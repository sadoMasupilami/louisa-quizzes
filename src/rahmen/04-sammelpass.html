<!-- Sammelpass: ein Feld pro Einheit zum Stempeln oder Bekleben, drei Gesichter zum Anmalen -->
<section class="seite kind sammelpass" id="sammelpass">
  <k-kopf bild="krone"></k-kopf>
  <div class="aufgabe-kopf" style="display: flex; align-items: center; gap: 3.5mm; margin-bottom: 4mm">
    <k-tun box name="kleben"></k-tun><k-tun box name="anmalen"></k-tun>
    <p class="fuer-mich" style="flex: 1">Nach jeder Einheit: ein Sticker oder Stempel in den Kreis. Dann malt {{KIND}} das Gesicht an, das passt: lachend (super), gerade (ging so), müde (heute nicht so).</p>
  </div>
  <k-sammelpass></k-sammelpass>
  <k-fuss text="Sammelpass"></k-fuss>
</section>
